[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visiomind-xh"
version = "0.1.0"
description = "Industrial perception, instruction decision, and robot execution agent"
requires-python = ">=3.10,<3.12"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
visiomind-plan = "visiomind.decision.cli:main"

[tool.setuptools.packages.find]
include = ["visiomind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
