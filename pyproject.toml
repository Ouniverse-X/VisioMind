[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visiomind-xh"
version = "0.1.0"
description = "Industrial perception, instruction decision, and robot execution agent"
requires-python = ">=3.10,<3.12"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
vision = ["torch>=2.2"]
llm = ["torch>=2.2", "transformers>=4.45", "peft>=0.13"]

[project.scripts]
visiomind-plan = "visiomind.plan.cli:main"
visiomind-action = "visiomind.action.entrypoints.examples.closed_loop.action_only:main"

[tool.setuptools.packages.find]
include = ["visiomind*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"scripts/run_qwen_industrial_planner.py" = ["E402"]
"training/evaluate_qwen_industrial_planner.py" = ["E402"]
"training/generate_qwen_lora_dataset.py" = ["E402"]
"training/train_industrial_vision_model.py" = ["E402"]
"visiomind/action/integrations/simulator/behavior/artifacts/process_logger.py" = ["F401"]
